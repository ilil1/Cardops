x-python-image: &python-image
  image: cardops-ai-service:local
  build:
    context: .
    dockerfile: backend/ai-service/Dockerfile

x-database-env: &database-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cardops_app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-cardops}

services:
  mysql:
    image: mysql:8.4
    container_name: cardops-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cardops}
      MYSQL_USER: ${MYSQL_USER:-cardops_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - cardops_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  model-builder:
    <<: *python-image
    restart: "no"
    environment:
      FORCE_MODEL_REBUILD: ${FORCE_MODEL_REBUILD:-false}
    command:
      - sh
      - -ec
      - |
        python -m cardops_ai.scripts.download_face_models
        if [ "$${FORCE_MODEL_REBUILD}" = "true" ] || \
           [ ! -f /app/outputs/models/classification_manifest.json ] || \
           ! grep -q '"artifact": "classification_lightgbm_final.joblib"' /app/outputs/models/classification_manifest.json || \
           [ ! -f /app/outputs/models/classification_lightgbm_final.joblib ] || \
           [ ! -f /app/outputs/models/regression_model.joblib ] || \
           [ ! -f /app/outputs/models/clustering_activity_gap.joblib ]; then
          python src/classification.py
          python src/final/classification_final.py
          python src/final/regression_final.py
          python src/final/clustering_final.py
        fi
    volumes:
      - ./outputs:/app/outputs

  db-init:
    <<: *python-image
    restart: "no"
    command: ["sh", "backend/ai-service/init-db.sh"]
    environment:
      <<: *database-env
      ALLOW_TEST_USER_SEEDING: ${ALLOW_TEST_USER_SEEDING:-false}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-}
      TEST_ANALYST_PASSWORD: ${TEST_ANALYST_PASSWORD:-}
      TEST_OPERATIONS_PASSWORD: ${TEST_OPERATIONS_PASSWORD:-}
      TEST_MARKETING_PASSWORD: ${TEST_MARKETING_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    <<: *python-image
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      MODEL_DIR: /app/outputs/models
    expose:
      - "8001"
    volumes:
      - ./outputs/models:/app/outputs/models:ro
    depends_on:
      model-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  core-service:
    build:
      context: .
      dockerfile: backend/core-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *database-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-60000}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/live').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Offline database/model jobs are explicitly invoked, never handled by an HTTP request.
  jobs:
    <<: *python-image
    profiles: [tools]
    environment:
      <<: *database-env
      MODEL_DIR: /app/outputs/models
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    command: ["python", "-m", "cardops_ai.scripts.run_analysis_batch"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      model-builder:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://core-service:8000
    depends_on:
      - core-service

volumes:
  cardops_mysql_data:
