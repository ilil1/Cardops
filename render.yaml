services:
  - type: web
    runtime: docker
    name: cardops-ai
    region: singapore
    plan: free
    dockerfilePath: ./backend/ai-service/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: MODEL_DIR
        value: /app/outputs/models
      - key: RENDER_BUILD_MODELS
        value: "true"

  - type: web
    runtime: docker
    # Keep the existing public API service name and URL.
    name: cardops-backend
    region: singapore
    plan: free
    dockerfilePath: ./backend/core-service/Dockerfile
    dockerContext: .
    # AI readiness is observable at /ready; AI outages must not restart Core.
    healthCheckPath: /live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      # Free web services cannot receive private-network requests. Use HTTPS + token.
      - key: AI_SERVICE_URL
        fromService:
          name: cardops-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          name: cardops-ai
          type: web
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_SERVICE_TIMEOUT_MS
        value: "60000"

  - type: web
    runtime: static
    name: cardops-frontend
    rootDir: frontend
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
